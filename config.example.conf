# nuvo-zone-keepalive configuration
# Copy this to config.conf and fill in your values.

# ---- Required ----

# The Nuvo zone's member MAC address, lowercase, no colons/separators.
# How to find it: this is embedded in the SSDP device UUID your zone
# announces (00000000-0000-0000-0000-XXXXXXXXXXXX), or you can sniff it
# from a "GroupCreate" / "X_NUVO_PlayContainerURI" SOAP call made by the
# official app (see README.md "Finding your MEMBER_MAC" for the full
# packet-capture walkthrough).
NUVO_MEMBER_MAC="000000000000"

# Cosmetic only: used to fill in the zone's display name/description in
# the metadata sent to Nuvo. Doesn't need to match anything exactly, but
# using your zone's real name is a sensible default.
NUVO_ZONE_NAME="My Zone"

# ---- Discovery mode ----
# "ssdp"   - (recommended) auto-discover the Nuvo's current IP/port via
#            SSDP + its device description, refreshed periodically by
#            discover.py. Survives IP/port changes automatically.
# "static" - skip discovery entirely and use a fixed host + paths below.
#            Simpler, but breaks if the Nuvo's IP or port ever changes.
NUVO_DISCOVERY_MODE="ssdp"

# ---- Static mode settings (only used when NUVO_DISCOVERY_MODE=static) ----
NUVO_STATIC_HOST="192.168.1.100:58587"
NUVO_STATIC_ZONE_CONTROL_PATH="/ZoneService/control"
NUVO_STATIC_AVTRANSPORT_CONTROL_PATH="/AVTransport/control"

# ---- SSDP mode settings (only used when NUVO_DISCOVERY_MODE=ssdp) ----
# Where discover.py caches the last-known-good control URLs, and where
# wake_zone.sh reads them from. discover.py only overwrites this file on
# a successful discovery, so a transient failure won't wipe out a working
# cached value.
NUVO_CACHE_FILE="/var/lib/nuvo-zone-keepalive/discovery-cache.conf"

# How many seconds discover.py waits for SSDP replies each run.
NUVO_SSDP_TIMEOUT="3"

# ---- Group cleanup ----
# GroupCreate mints a brand-new group every time it's called and never
# cleans up after itself. wake_zone.sh tracks the last groupID it created
# here and disbands it before creating the next one, to avoid an
# ever-growing pile of orphaned groups on the Nuvo. Safe to delete this
# file at any time; it'll just be recreated on the next run.
NUVO_GROUP_STATE_FILE="/var/lib/nuvo-zone-keepalive/last-group-id.conf"

# Where wake_zone.sh logs each run's SOAP responses. Defaults next to the
# script itself, but if wake_zone.sh runs as a different user than
# whoever installed it (e.g. triggered by shairport-sync's own service
# user via a sessioncontrol hook), that directory likely won't be
# writable by that user -- point this at the same writable directory as
# the state files above instead. See "Running as the shairport-sync
# user" in the README.
NUVO_LOG_FILE="/var/lib/nuvo-zone-keepalive/wake_zone.log"

