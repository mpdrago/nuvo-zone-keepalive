// Add this block to /etc/shairport-sync.conf (or merge into an existing
// sessioncontrol block), then `sudo systemctl restart shairport-sync`.
//
// Adjust the path to wherever you installed nuvo-zone-keepalive.

sessioncontrol =
{
    run_this_before_play_begins = "/opt/nuvo-zone-keepalive/wake_zone.sh";
    wait_for_completion = "no";
};
