// Add this block to /etc/shairport-sync.conf (or merge into an existing
// sessioncontrol block), then `sudo systemctl restart shairport-sync`.
//
// Adjust the path to wherever you installed nuvo-zone-keepalive.

sessioncontrol =
{
    run_this_before_play_begins = "/opt/nuvo-zone-keepalive/wake_zone.sh";
    wait_for_completion = "no";

    // Optional: immediately disbands the group when playback stops,
    // instead of leaving it for the Nuvo's own idle timeout or the next
    // wake_zone.sh run to clean up. Purely a tidiness improvement -- see
    // "Tearing the zone down on stop (optional)" in the README. Uncomment
    // to enable:
    // run_this_after_play_ends = "/opt/nuvo-zone-keepalive/tear_zone_down.sh";
};
